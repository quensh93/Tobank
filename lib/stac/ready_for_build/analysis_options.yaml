# This localized analysis_options.yaml file tells the Dart IDE Analyzer 
# to ignore specific strict-typing errors ONLY inside this directory and its subdirectories.
# This allows you to write custom Stac widgets (like StacStatefulWidget) 
# that are defined in the main app without throwing red syntax errors here, 
# and without breaking the isolated 'stac build' execution with Flutter imports.

analyzer:
  errors:
    undefined_function: ignore
    undefined_method: ignore
    undefined_identifier: ignore
    undefined_class: ignore
    creation_with_non_type: ignore
