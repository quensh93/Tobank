name: tobank_sdui
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  collection: ^1.18.0
  hooks_riverpod: ^3.0.3
  riverpod_annotation: ^4.0.0
  dio: ^5.9.0
  logger:
    path: tools/logger
  flutter_secure_storage: ^10.0.0
  path_provider: ^2.1.5
  slow_net_simulator: ^1.0.0
  flutter_performance_pulse: ^1.0.6
  ispect: 4.6.0
  ispectify: 4.6.0
  ispectify_dio: 4.6.0
  #stac:
  #  path: .stac/packages/stac
  stac: ^1.5.0
  stac_core: ^1.5.0
  debug_panel:
    path: lib/debug_panel
  uuid: ^4.5.2
  shared_preferences: ^2.5.4
  file_picker: ^11.0.2
  image_picker: ^1.2.0
  image_cropper: ^12.2.1
  flutter_native_contact_picker: ^0.0.10
  permission_handler: ^11.4.0
  share_plus: ^12.0.1
  url_launcher: ^6.3.2
  just_audio: ^0.10.5
  webview_flutter: ^4.13.0
  device_frame: ^1.4.0
  package_info_plus: ^9.0.0
  # Missing dependencies
  crypto: ^3.0.7
  meta: ^1.17.0
  persian_datetime_picker: ^3.2.0
  flutter_svg: ^2.2.3
  ml_card_scanner: ^0.2.3
  syncfusion_flutter_pdf: ^31.2.18
  syncfusion_flutter_pdfviewer: ^31.1.21
  secure_plugin:
    path: secure_plugin




  flutter_riverpod: any
  shamsi_date: 1.1.1
  universal_io: ^2.3.1
  local_auth: ^3.0.0
  get: ^4.7.3
  universal_html: ^2.3.0
  stac_framework: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner:
  custom_lint:
  riverpod_generator: ^4.0.0+1
  riverpod_lint: ^3.0.3
  flutter_launcher_icons: ^0.14.3

# Force use of local logger instead of pub.dev version
# This allows us to customize the logger package
dependency_overrides:
  logger:
  # stac_logger:
  #   path: .stac/packages/stac_logger  # Temporarily commented out - folder doesn't exist

flutter_icons:
  image_path: 'assets/images/logo.png'
  android: true
  ios: false

flutter:
  uses-material-design: true
  
  assets:
    - assets/icons/
    - assets/images/
    - lib/stac/.build/
    - lib/stac/design_system/
    - lib/stac/design_system/tobank_theme_light.json
    - lib/stac/design_system/tobank_theme_dark.json
    - lib/stac/design_system/colors.json
    - lib/stac/design_system/GET_styles.json
    - lib/stac/config/
    - lib/stac/config/assets.json



    # Flows — dev-only mock JSON + local API. Tagged flavors:[dev] so a
    # `--flavor prod` build excludes them (server-driven, apiJson only).

    - path: lib/stac/tobank/flows/login/json/
      flavors: [dev]
    - path: lib/stac/tobank/flows/login/api/
      flavors: [dev]


    # Promissory Flow

    - path: lib/stac/tobank/flows/promissory/json/
      flavors: [dev]
    - path: lib/stac/tobank/flows/promissory/api/
      flavors: [dev]
    - path: lib/stac/tobank/flows/promissory_guarantee/json/
      flavors: [dev]
    - path: lib/stac/tobank/flows/authentication/json/
      flavors: [dev]
    - path: lib/stac/tobank/flows/transaction/json/
      flavors: [dev]
    - path: lib/stac/tobank/flows/notification/json/
      flavors: [dev]
    - path: lib/stac/tobank/flows/deposit_turnover/json/
      flavors: [dev]
    - path: lib/stac/tobank/flows/deposit_more_options/json/
      flavors: [dev]
    - path: lib/stac/tobank/flows/profile/json/
      flavors: [dev]
    - path: lib/stac/tobank/flows/dashboard/json/
      flavors: [dev]
    - path: lib/stac/tobank/flows/card_management/json/
      flavors: [dev]
    - path: lib/stac/tobank/flows/charge/json/
      flavors: [dev]
    - path: lib/stac/tobank/flows/child_loan/json/
      flavors: [dev]
    - path: lib/stac/tobank/flows/home_page/json/
      flavors: [dev]
    - path: lib/stac/tobank/flows/transfer/json/
      flavors: [dev]
    - path: lib/stac/tobank/flows/gift_card/json/
      flavors: [dev]
    - path: lib/stac/tobank/flows/internet_pakage/json/
      flavors: [dev]
    - path: lib/stac/tobank/flows/user_credit_validation/json/
      flavors: [dev]
    - path: lib/stac/tobank/flows/installment_payment/json/
      flavors: [dev]
    - path: lib/stac/tobank/flows/installment_payment/json_upload/
      flavors: [dev]
    - path: lib/stac/tobank/flows/cartable/json/
      flavors: [dev]



  fonts:
    - family: IranYekan
      fonts:
        - asset: assets/fonts/IRANYekanMobileRegular.ttf
        - asset: assets/fonts/IRANYekanMobileMedium.ttf
          weight: 500
        - asset: assets/fonts/IRANYekanMobileBold.ttf
          weight: 700
        - asset: assets/fonts/IRANYekanMobileExtraBold.ttf
          weight: 900
