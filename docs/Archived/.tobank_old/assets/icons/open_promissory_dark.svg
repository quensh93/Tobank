<svg fill="none" height="24" width="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- بدنه اصلی آیکن با رنگ سفید -->
  <path d="M22 10v5c0 5-2 7-7 7H9c-5 0-7-2-7-7V9c0-5 2-7 7-7h5"
        stroke="#F2F4F7" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2"/>
  <path d="M22 10h-4c-3 0-4-1-4-4V2l8 8z"
        stroke="#F2F4F7" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2"/>

  <!-- تایمر قرمز: سه‌ربع خطی -->
  <path d="M13.6 15.4 A4.1 4.1 0 1 1 9.5 11.3"
        stroke="#D61F2C" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- ربع بالایی نقطه‌چین -->
  <path d="M9.5 11.3 A4.1 4.1 0 0 1 13.6 15.4"
        stroke="#D61F2C" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="2 2"/>

  <!-- عقربه دقیقه (۰۰ دقیقه = بالا → با فاصله بیشتر) -->
