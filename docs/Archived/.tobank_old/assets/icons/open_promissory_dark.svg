        stroke="#D61F2C" stroke-width="1" stroke-linecap="round"/>

  <!-- عقربه ساعت (۳ = راست → با فاصله بیشتر) -->
  <line x1="9.5" y1="15.4" x2="11.9" y2="15.4"
        stroke="#D61F2C" stroke-width="1" stroke-linecap="round"/>
</svg>
